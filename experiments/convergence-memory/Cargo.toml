[workspace]
members = ["crates/cm-trace", "crates/cm-candidate", "crates/cm-harness"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = "deny"

[profile.dev]
overflow-checks = true
[profile.test]
overflow-checks = true
debug-assertions = true
[profile.release]
overflow-checks = true
